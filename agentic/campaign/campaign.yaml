# Campaign defaults — CLI and CampaignSpec both read this file.
# Override with --campaign-yaml PATH, {working-dir}/campaign.yaml, or env vars.
# Agent YAML files (planner/analysis/…) stay for prompts only.

# MSA / mapping
conservation_metric: similarity   # similarity | identity | blosum | coverage
min_conservation: 0.5             # group-similarity / identity / BLOSUM threshold
min_coverage: 0.25                # column occupancy floor
pocket_cutoff_A: 15.0             # reference ligand shell (Å)
lobe_method: auto                 # auto | consensus_index | reference_resid | midpoint

# Retrieval
retrieval_k: 16                   # top-k tools for the planner
embed_model: nomic-embed-text    # dense blend when this Ollama model answers;
                                  # hashed n-grams remain if it does not
                                  # AGENTIC_EMBED_MODEL overrides when set

# What each agent retrieves before its model call. Required calculations stay
# in the planner tool list; these knobs only add context.
agent_retrieval:
  analysis:
    knowledge_k: 4
    memory_k: 5
    study_k: 4
  reporter:
    knowledge_k: 6
    memory_k: 4
    study_k: 6
  supervisor:
    knowledge_k: 2
    memory_k: 5
    study_k: 4
    route_once: true
    allowed_destinations:
      - analysis
      - reporter
      - final_report

# Family mode: force | auto | off
# auto = detector score; force always family_modular; off never.
family_modular: auto

# Feature pack for family campaigns (ignored when family_modular is off).
# from_goal (default) reads the descriptors in the user goal. Any count.
# Optional presets: shared_pocket_dynamics, pocket_chi_rmsf_dccm, rmsf_dccm_only.
# paper_sharedpcdyn is a legacy alias of shared_pocket_dynamics.
feature_pack: from_goal

# Shared-reference dynamics label (directory name under the campaign base).
# Empty = first system that has consensus dihedrals, then p17612* if present.
reference_label: ""

# Optional extra family descriptors. Each entry is merged into the active pack.
# feature_plugins:
#   - tool_name: calculate_consensus_rmsf_features
#     output_dir: consensus_rmsf
#     feature_columns: [consensus_rmsf_mean_A]
#     stage: per_sim          # per_sim | post | pre
#     metric_group: consensus_rmsf
feature_plugins: []

# Optional exact feature list. Empty = take the columns the goal names.
# A non-empty list replaces the parsed columns and can be any length.
gold_columns: []

# Human-in-the-loop: null | error | all
# CLI --HITL still wins when passed.
hitl: null
